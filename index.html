<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты | My Projects</title>
    <meta name="description" content="Портфолио моих проектов: сайты, боты и приложения.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loader -->
    <div id="loader" class="loader">
        <div class="loader-content">
            <div class="loader-logo">MP</div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
            <div class="loader-text">Загрузка портфолио...</div>
        </div>
    </div>

    <!-- Background particles -->
    <canvas id="particles" class="particles"></canvas>

    <!-- Main content -->
    <main class="main">
        <header class="hero">
            <div class="hero-badge">Portfolio</div>
            <h1 class="hero-title">Мои проекты</h1>
            <p class="hero-subtitle">
                Коллекция моих сайтов, ботов и экспериментов. <br>
                Здесь я собираю всё, что создаю — от игр до образовательных платформ.
            </p>
        </header>

        <section class="projects-section">
            <div class="section-header">
                <h2 class="section-title">Все проекты</h2>
                <span class="project-count" id="project-count">0</span>
            </div>
            <div class="projects-grid" id="projects-grid">
                <!-- Карточки проектов загружаются из projects.json -->
            </div>
        </section>

        <footer class="footer">
            <p>Made with <span class="heart">❤</span> by Матвей</p>
            <p class="footer-hint">Новые проекты добавляются прямо в <code>projects.json</code></p>
        </footer>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
